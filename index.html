<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AIScanner - Simple document scanning, OCR and PDF tools.">
    <title>AIScanner</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8fb;
            color: #202124;
            line-height: 1.6;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 24px;
        }

        .card {
            margin-top: 70px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 38px;
        }

        .tagline {
            margin: 0 auto 28px;
            max-width: 600px;
            color: #5f6368;
            font-size: 18px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid #d1d5db;
            color: #202124;
            background: #fff;
            font-weight: 600;
        }

        .button:hover {
            background: #f3f4f6;
        }

        .primary {
            color: #fff;
            background: #2563eb;
            border-color: #2563eb;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        footer {
            margin-top: 35px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container { padding: 16px; }

            .card {
                margin-top: 30px;
                padding: 36px 22px;
            }

            h1 { font-size: 30px; }

            .tagline { font-size: 16px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>AIScanner</h1>

            <p class="tagline">
                A simple document scanning application with OCR, PDF creation,
                document organization, and easy sharing.
            </p>

            <div class="links">
                <a class="button primary"
                   href="https://play.google.com/store/apps/details?id=com.tool.aiscanner"
                   target="_blank"
                   rel="noopener noreferrer">
                    View on Google Play
                </a>

                <a class="button"
                   href="aiscanner-privacy-policy.html">
                    Privacy Policy
                </a>
            </div>

            <footer>
                © 2026 AIScanner. All rights reserved.
            </footer>
        </section>
    </main>
</body>
</html>
